[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-free-credit-tracker"
dynamic = ["version"]
description = "Local-first dashboard for monitoring OpenAI complimentary daily tokens and API costs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "柯佩廷" }]
keywords = ["openai", "quota", "usage", "dashboard", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  # cryptography 49+ removed macOS x86_64 wheels. Source builds bind to the
  # runner's Homebrew OpenSSL and are not reproducible inside PyInstaller.
  "cryptography>=43.0,<49.0",
]

[project.optional-dependencies]
desktop = [
  "desktop-notifier>=6.2,<7",
  "Pillow>=10.4",
  "pystray>=0.19.5,<0.20",
]

[project.scripts]
openai-free-credit-tracker = "quota_monitor.app:main"
openai-free-credit-tracker-manifest = "quota_monitor.update_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "quota_monitor.version.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "native_desktop: opt-in tests that interact with the current OS desktop services",
]
