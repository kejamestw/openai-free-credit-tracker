name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/validate_models.py
      - run: python scripts/validate_locales.py
      - run: python scripts/validate_contracts.py
      - run: python scripts/validate_docs.py
      - name: Secret and tracked-text audit
        run: python scripts/audit_repository.py
      - run: python -m pytest -q --basetemp build/pytest-ci-${{ runner.os }}-${{ matrix.python }}
      - run: node --check web/js/domain.js
      - run: node --check web/js/app.js
      - run: node --test tests/frontend_domain.test.cjs

  supply-chain:
    name: Supply-chain and quality evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -e ".[desktop]" -r requirements-dev.txt
      - run: python scripts/audit_dependencies.py --output build/dependency-audit.json
      - run: python scripts/generate_sbom.py --output build/OpenAI-Free-Credit-Tracker.cdx.json
      - run: python scripts/inventory_licenses.py --output build/license-inventory.json --fail-on-unknown
      - name: Full synthetic performance and accelerated 72-hour soak
        run: python scripts/run_quality_harness.py all --days 365 --projects 100 --hours 72 --output build/quality-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-reports
          path: |
            build/dependency-audit.json
            build/OpenAI-Free-Credit-Tracker.cdx.json
            build/license-inventory.json
            build/quality-evidence.json
          if-no-files-found: error
          retention-days: 14
